org: sebastianlizarraga
service: lms-cursos

provider:
  name: aws
  runtime: python3.12
  memorySize: 1024
  timeout: 30
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  iam:
    role: arn:aws:iam::198909467842:role/LabRole
  environment:
    TABLE_NAME: lms-courses-${sls:stage}
    AUTHORIZER_ARN: ${env:AUTHORIZER_LAMBDA_ARN}

functions:

  # ─── Validator (invocado por Step Functions de Matrículas, sin HTTP event) ───
  validatorCursos:
    handler: src/validators.handler

  # ─── Endpoints privados ───────────────────────────────────────────────────────
  createCourse:
    handler: src/handlers.create_course
    events:
      - http:
          path: /v1/courses
          method: post
          cors: true
          integration: lambda
          authorizer:
            arn: ${env:AUTHORIZER_LAMBDA_ARN}
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: request

  listCourses:
    handler: src/handlers.list_courses
    events:
      - http:
          path: /v1/courses
          method: get
          cors: true
          integration: lambda
          authorizer:
            arn: ${env:AUTHORIZER_LAMBDA_ARN}
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: request

  getCourse:
    handler: src/handlers.get_course
    events:
      - http:
          path: /v1/courses/{courseId}
          method: get
          cors: true
          integration: lambda
          authorizer:
            arn: ${env:AUTHORIZER_LAMBDA_ARN}
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: request

  updateCourse:
    handler: src/handlers.update_course
    events:
      - http:
          path: /v1/courses/{courseId}
          method: patch
          cors: true
          integration: lambda
          authorizer:
            arn: ${env:AUTHORIZER_LAMBDA_ARN}
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: request

resources:
  Resources:

    TablaCursos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_NAME}
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        GlobalSecondaryIndexes:
          - IndexName: GSI_BY_TEACHER
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

  Outputs:

    ValidatorCursosArn:
      Value: !GetAtt ValidatorCursosLambdaFunction.Arn
      Export:
        Name: lms-validator-cursos-arn-${sls:stage}
