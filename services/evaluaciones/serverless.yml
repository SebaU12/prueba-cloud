org: sebastianlizarraga
service: lms-evaluaciones

provider:
  name: aws
  runtime: python3.12
  memorySize: 1024
  timeout: 30
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  iam:
    role: arn:aws:iam::198909467842:role/LabRole
  environment:
    TABLE_NAME: lms-evaluations-${sls:stage}

functions:

  createEvaluation:
    handler: src/handlers.create_evaluation
    events:
      - http:
          path: /v1/evaluations
          method: post
          cors: true

          authorizer:
            arn: ${env:AUTHORIZER_LAMBDA_ARN}
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: request

  listEvaluations:
    handler: src/handlers.list_evaluations
    events:
      - http:
          path: /v1/evaluations
          method: get
          cors: true

          authorizer:
            arn: ${env:AUTHORIZER_LAMBDA_ARN}
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: request

  getEvaluation:
    handler: src/handlers.get_evaluation
    events:
      - http:
          path: /v1/evaluations/{evaluationId}
          method: get
          cors: true

          authorizer:
            arn: ${env:AUTHORIZER_LAMBDA_ARN}
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: request

  updateEvaluation:
    handler: src/handlers.update_evaluation
    events:
      - http:
          path: /v1/evaluations/{evaluationId}
          method: patch
          cors: true

          authorizer:
            arn: ${env:AUTHORIZER_LAMBDA_ARN}
            resultTtlInSeconds: 0
            identitySource: method.request.header.Authorization
            type: request

resources:
  Resources:

    TablaEvaluaciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_NAME}
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        GlobalSecondaryIndexes:
          - IndexName: GSI_BY_EVALUATION
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
